name: Pull request validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm run test

      - name: Verify NPS source snapshots
        run: npm run check:nps-integrity

      - name: Run deterministic stress scenarios
        run: npm run scenario:stress

      - name: Run fixed-seed system stress
        run: npm run stress:system

      - name: Confirm generated evidence is current
        run: git diff --exit-code

      - name: Build production application
        run: npm run build

      - name: Install Firefox for accessibility checks
        run: npx playwright install --with-deps firefox

      - name: Run accessibility checks
        run: npm run test:a11y

      - name: Upload NPS integrity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: nps-source-integrity-${{ github.run_number }}
          path: .artifacts/nps-source-integrity/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-${{ github.run_number }}
          path: /tmp/trailpack-playwright-results/
          if-no-files-found: ignore
          retention-days: 14
